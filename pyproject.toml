[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-forensics"
version = "0.1.0"
description = "Composable queries for tracing crypto wallet drains across EVM chains and Solana"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
kit = "forensics.cli:main"

[tool.setuptools]
packages = ["forensics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
